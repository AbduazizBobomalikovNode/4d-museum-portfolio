name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate only. Runs on every push and PR; deployment is done by
  # Vercel's Git integration, not by this workflow.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # fully mocked and offline
      - run: pnpm test:feedback

      # same command Vercel runs, so a build that passes here passes there
      - run: BASE_PATH=/ VITE_FEEDBACK_ENDPOINT=/api/feedback pnpm build
        env:
          # raises the GitHub snapshot fetch from 60 to 1000 requests/hour;
          # a failed fetch keeps the committed snapshot and never fails the build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
