name: CI · Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate. Runs on every push and PR, with or without Vercel credentials —
  # so a broken build is caught even before deployment is wired up.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # same command Vercel runs, so a build that passes here passes there
      - run: BASE_PATH=/ VITE_FEEDBACK_ENDPOINT=/api/feedback pnpm build
        env:
          # raises the GitHub snapshot fetch from 60 to 1000 requests/hour;
          # a failed fetch keeps the committed snapshot and never fails the build
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    # only production pushes, and only once the Vercel secrets exist
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # secrets cannot be referenced in an `if:`, so the check happens in a step
      - name: Skip if Vercel is not configured yet
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "VERCEL_TOKEN yo'q — deploy o'tkazib yuborildi (repo Settings → Secrets)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # `vercel build` runs the buildCommand from vercel.json, which uses pnpm
      - if: steps.guard.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.guard.outputs.ready == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - if: steps.guard.outputs.ready == 'true'
        run: npx --yes vercel@latest build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.guard.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
